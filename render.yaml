services:
  - type: web
    name: dreamtune-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dreamtune-postgres
          property: connectionString
      - key: PUBLIC_API_URL
        sync: false
      - key: SUPPORT_EMAIL
        value: dreamtuneteam@gmail.com
      - key: SMTP_USER
        value: dreamtuneteam@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

databases:
  - name: dreamtune-postgres
    plan: free
